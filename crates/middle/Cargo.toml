[package]
name = "middle"
resolver = "2"
version = "0.5.0"
readme = "README.md"
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = """
Client Authorization Middleware for APIs secured via OAuth2 or Bearer Tokens. Tonic & reqwest integration.
"""

[features]
all = ["rustls-tls", "tonic", "client-credentials", "runtime-tokio"]
default = ["rustls-tls", "client-credentials", "runtime-tokio"]
rustls-tls = ["reqwest/rustls"]
tonic = ["dep:tonic"]
runtime-tokio = ["tokio"]
client-credentials = []

[dependencies]
http = "1"
reqwest = { version = "0.13", default-features = false }
serde_json = "1.0"
thiserror = { version = "2.0" }
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
tonic = { workspace = true, optional = true }
# chrono = { version = "0.4", optional = true }
tracing = { version = "^0.1", features = ["attributes"] }
typed-builder = "0.23"
url = { workspace = true, features = ["serde"] }
veil = "0.3"

[dev-dependencies]
mockito = "1.7"
pretty_assertions = "1.4"
serde_json = "1.0"
tokio = { version = "1.43", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
tracing-test = "0.2.5"

[[test]]
name = "token_request"
required-features = ["client-credentials"]

[[test]]
name = "token_response"
required-features = ["client-credentials"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
