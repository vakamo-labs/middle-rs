[package]
name = "middle"
resolver = "2"
version = "0.5.0"
readme = "README.md"
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = """
Client Authorization Middleware for APIs secured via OAuth2 or Bearer Tokens. Tonic & reqwest integration.
"""

[features]
all = [
    "rustls-tls",
    "tonic",
    "client-credentials",
    "runtime-tokio",
    "jwt",
    "aws-lc-rs",
]
default = ["rustls-tls", "client-credentials", "runtime-tokio", "aws-lc-rs"]
rustls-tls = ["reqwest/rustls"]
tonic = ["dep:tonic"]
runtime-tokio = ["tokio"]
client-credentials = []
# Signs JWT assertions (RFC 7523). Needs the crypto backend `aws-lc-rs` or `rust-crypto`.
jwt = [
    "dep:base64",
    "dep:getrandom",
    "dep:jsonwebtoken",
    "dep:pem",
    "dep:simple_asn1",
    "dep:strum",
]
# Crypto backend for `jwt`. With both enabled, middle uses aws-lc-rs.
# If the application also uses jsonwebtoken 12, enable the same backend here as in jsonwebtoken. With both backends in one build, jsonwebtoken has no default provider, and the application's own `jsonwebtoken::encode` and `decode` calls panic unless it calls `jsonwebtoken::crypto::CryptoProvider::install_default` at startup. middle passes its provider to every call and is not affected.
aws-lc-rs = ["jsonwebtoken?/aws_lc_rs"]
rust-crypto = ["jsonwebtoken?/rust_crypto"]

[dependencies]
base64 = { version = "0.23", optional = true }
getrandom = { version = "0.4", optional = true }
http = "1"
jsonwebtoken = { version = "12.0", default-features = false, features = [
    "use_pem",
], optional = true }
pem = { version = "4", optional = true }
reqwest = { version = "0.13", default-features = false }
serde_json = "1.0"
simple_asn1 = { version = "0.6", optional = true }
strum = { version = "0.27", features = ["derive"], optional = true }
thiserror = { version = "2.0" }
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
tonic = { workspace = true, optional = true }
# chrono = { version = "0.4", optional = true }
tracing = { version = "^0.1", features = ["attributes"] }
typed-builder = "0.23"
url = { workspace = true, features = ["serde"] }
veil = "0.3"

[dev-dependencies]
base64 = "0.23"
jsonwebtoken = { version = "12.0", default-features = false, features = [
    "use_pem",
] }
mockito = "1.7"
pretty_assertions = "1.4"
serde_json = "1.0"
tokio = { version = "1.43", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
tracing-test = "0.2.5"

[[test]]
name = "jwt"
required-features = ["jwt"]

[[test]]
name = "token_request"
required-features = ["client-credentials"]

[[test]]
name = "token_response"
required-features = ["client-credentials"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
