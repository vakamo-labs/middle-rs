[package]
name = "middle"
version = "0.5.0"
readme = "README.md"
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = """
Keeps OAuth2 and bearer tokens fresh for HTTP and gRPC clients, with a tonic interceptor.
"""
keywords = ["oauth2", "bearer", "token", "tonic", "jwt"]
categories = ["authentication", "web-programming::http-client"]

[features]
all = ["rustls", "tonic", "oauth", "jwt", "aws-lc-rs"]
default = ["rustls", "oauth"]
# TLS for the token endpoint client. Without it, the application enables a TLS feature of reqwest 0.13.
rustls = ["reqwest?/rustls"]
tonic = ["dep:tonic"]
# Tokens that middle requests and refreshes on Tokio: from a token endpoint, or from a `TokenSource` of the application.
oauth = [
    "dep:base64",
    "dep:libc",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:url",
]
# Signs JWT assertions (RFC 7523). Enable it with exactly one crypto backend, `aws-lc-rs` or `rust-crypto`. If the application uses jsonwebtoken 12, choose the backend it uses. Without a backend, middle does not compile.
jwt = [
    "oauth",
    "dep:der",
    "dep:getrandom",
    "dep:jsonwebtoken",
    "dep:pem",
    "dep:pkcs1",
    "dep:pkcs8",
    "dep:sec1",
    "dep:spki",
    "dep:strum",
]
# Crypto backends for `jwt`. They change nothing without `jwt`.
# With both enabled, as with `--all-features`, middle uses aws-lc-rs, and jsonwebtoken has no default provider: the application's own `jsonwebtoken::encode` and `decode` calls panic unless it calls `jsonwebtoken::crypto::CryptoProvider::install_default` at startup. middle passes its provider to every call and is not affected.
aws-lc-rs = ["jsonwebtoken?/aws_lc_rs"]
rust-crypto = ["jsonwebtoken?/rust_crypto"]

[dependencies]
base64 = { version = "0.23", optional = true }
der = { version = "0.8.3", features = ["alloc", "oid"], optional = true }
getrandom = { version = "0.4", optional = true }
http = "1"
jsonwebtoken = { version = "12.0", default-features = false, optional = true }
pem = { version = "4", optional = true }
pkcs1 = { version = "0.8.0", features = ["alloc"], optional = true }
pkcs8 = { version = "0.11.0", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
sec1 = { version = "0.8.1", default-features = false, features = [
    "der",
], optional = true }
serde_json = { version = "1.0", optional = true }
spki = { version = "0.8.1", optional = true }
strum = { version = "0.27", features = ["derive"], optional = true }
thiserror = { version = "2.0" }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
tonic = { workspace = true, optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
url = { workspace = true, optional = true }
veil = "0.3"

[target.'cfg(unix)'.dependencies]
# `O_NONBLOCK`, so that opening an assertion file never blocks.
libc = { version = "0.2", optional = true }

[dev-dependencies]
base64 = "0.23"
jsonwebtoken = { version = "12.0", default-features = false, features = [
    "use_pem",
] }
mockito = "1.7"
pretty_assertions = "1.4"
serde_json = "1.0"
tokio = { version = "1.43", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "test-util",
    "time",
] }
tracing-test = "0.2.5"

[[test]]
name = "client_assertion"
required-features = ["oauth"]

[[test]]
name = "interceptor"
required-features = ["oauth", "tonic"]

[[test]]
name = "jwt"
required-features = ["jwt"]

[[test]]
name = "jwt_bearer_grant"
required-features = ["oauth"]

[[test]]
name = "jwt_client_authentication"
required-features = ["jwt"]

[[test]]
name = "proxy"
required-features = ["oauth"]

[[test]]
name = "token_refresh"
required-features = ["oauth"]

[[test]]
name = "token_request"
required-features = ["oauth"]

[[test]]
name = "token_response"
required-features = ["oauth"]

[[test]]
name = "token_source"
required-features = ["oauth"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
